# Lighthouse CI on homepage-touching PRs (design-elevation milestone p3-lighthouse).
#
# Reading the result: lighthouserc.json asserts on the MEDIAN of 5 runs. LHCI's
# default aggregation is "optimistic", which silently reports the run most
# likely to PASS (the best one) — a flattering number that hides the spread and
# makes a regression easy to miss. Median is the honest central estimate. It is
# stricter than the old default, so expect reported values to move even where
# the page did not change.
#
# WHAT RED MEANS: "this PR made the page slower", not "the page is not fast
# yet". The thresholds in lighthouserc.json are a REGRESSION FLOOR derived from
# a measured baseline, not the target. JSON takes no comments, so the numbers
# are justified here.
#
# Baseline, main @ f3c3e73, measured 2026-07-28 through this workflow:
#   perf median 0.72–0.76 · LCP median 4822–5039ms · CLS ~0.02 · TBT ~132ms
#   within-run LCP spread 635–807ms · median-to-median drift 217ms
#
#   floor  perf >= 0.65   ~0.07 under the worst measured median
#   floor  LCP  <= 5500ms  ~460ms over the worst measured median, roughly 2x the
#                          observed median drift, so it catches a regression of
#                          ~500ms or worse without firing on noise
#   guard  CLS  <= 0.1     unchanged; measured ~0.02, real headroom
#   warn   TBT  <= 300ms   unchanged; measured ~132ms
#
# THE TARGET IS STILL perf 0.9 / LCP 2500ms. It is deliberately not asserted,
# because it is not reachable as the page is built today and a permanently red
# check is a check everyone learns to ignore. Measured on 2026-07-28 (PR #371,
# closed): stripping ALL client JS — no hydration, no interactivity — moved LCP
# only 4822ms -> 3169ms. A perfect result on the app bundle still lands ~700ms
# above 2500ms. The remaining 683KB floor is 267KB third-party analytics (gtag,
# fbevents), 200KB images, and 132KB fonts.
#
# Do not "fix" a red check here by raising these numbers. Raising the floor to
# accommodate a regression is how the budget stops meaning anything. Lower them
# when the page genuinely gets faster, and re-derive from a fresh baseline.
#
# Runs against the Vercel preview deployment for the PR branch. If the Vercel
# project has Deployment Protection enabled, add the project's automation
# bypass secret to the repo as VERCEL_AUTOMATION_BYPASS_SECRET (Vercel project
# → Settings → Deployment Protection → Protection Bypass for Automation);
# without it, protected previews serve Vercel's auth page and the run reports
# that instead of failing confusingly.
name: lighthouse

on:
  pull_request:
    paths:
      - 'app/**'
      - 'server/**'
      - 'vercel.json'
      - 'package.json'
      - '.github/workflows/lighthouse.yml'
      # Budgets and run count live here; a change to them must re-measure.
      - 'lighthouserc.json'

permissions:
  contents: read
  statuses: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel preview
        id: preview
        # Non-fatal on purpose: the action errors on a 401 wall, and the gate
        # below is where that becomes a verdict. Which verdict depends on
        # whether the bypass secret exists (see below).
        continue-on-error: true
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          vercel_protection_bypass_header: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # Reachability gate. This step used to turn EVERY unreachable preview into
      # a clean pass, so a green lighthouse check proved only that the job ran.
      # New rule: when VERCEL_AUTOMATION_BYPASS_SECRET is configured, the preview
      # is expected to be reachable and an unreachable one FAILS the job. The
      # clean skip survives only for the genuinely unconfigured case, where
      # there is nothing the run could have measured.
      #
      # Lighthouse stays NON-required for merge (repo branch protection): a perf
      # regression should file a ticket, not stall the release train on flaky
      # preview timing. Failing here makes the signal honest without making it
      # a gate.
      - name: Check preview is reachable
        id: reachable
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${BYPASS}" ]; then
            echo "::notice::VERCEL_AUTOMATION_BYPASS_SECRET is not set, so a protected preview cannot be fetched. Skipping Lighthouse. Add the secret (Vercel project -> Settings -> Deployment Protection -> Protection Bypass for Automation) to turn this into a real measurement."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${PREVIEW_URL}" ]; then
            echo "::error::No Vercel preview URL for this PR, but VERCEL_AUTOMATION_BYPASS_SECRET is configured. Either the preview build failed or the wait step timed out. Not reporting a pass for a page that was never measured."
            exit 1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "x-vercel-protection-bypass: ${BYPASS}" \
            -H "x-vercel-set-bypass-cookie: false" \
            "${PREVIEW_URL}/")
          if [ "$code" != "200" ]; then
            echo "::error::Preview ${PREVIEW_URL}/ returned HTTP ${code} with the bypass header applied. A wrong or expired bypass secret returns 401/403; a broken deployment returns 5xx. Failing rather than measuring an auth page or silently passing."
            exit 1
          fi

          echo "Preview reachable (HTTP 200)."
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Cold starts, not the page, were the loudest thing this job measured.
      # Every PR gets a fresh Vercel preview, and vercel.json routes EVERY
      # request (including /assets/*) through the Node function, so the first
      # visitor pays a function cold start for the document and again for the
      # asset graph. Lighthouse was that first visitor.
      #
      # Measured on 2026-07-28: the same commit, re-run, moved its observed
      # first paint from a flat 2310ms across 6 runs to a 309-2546ms spread,
      # and simulated LCP swung 3764-7863ms. That is wider than any change
      # worth shipping, which made every perf PR unfalsifiable.
      #
      # So: warm the function and the asset graph before measuring. Failures
      # here are deliberately non-fatal — a warm-up that could not run is a
      # noisier measurement, not a reason to report a verdict on the page.
      - name: Warm the preview
        if: steps.reachable.outputs.ok == 'true'
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -uo pipefail
          hdr=(-H "x-vercel-protection-bypass: ${BYPASS}" -H "x-vercel-set-bypass-cookie: false")

          for path in "/" "/?variant=b"; do
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${hdr[@]}" "${PREVIEW_URL}${path}" || echo 000)
              echo "document ${path} warm ${i}: HTTP ${code}"
            done
          done

          # The document is only half of it. Pull the asset graph the page
          # actually references so JS/CSS/fonts are warm too, deduped and
          # bounded so a big manifest cannot stall the job.
          html=$(curl -s --max-time 30 "${hdr[@]}" "${PREVIEW_URL}/" || true)
          assets=$(printf '%s' "$html" | grep -oE '/assets/[A-Za-z0-9._-]+' | sort -u | head -60)
          count=0
          for a in $assets; do
            curl -s -o /dev/null --max-time 20 "${hdr[@]}" "${PREVIEW_URL}${a}" || true
            count=$((count + 1))
          done
          echo "warmed ${count} asset(s)"

      - name: Inject protection-bypass header into LHCI config
        if: steps.reachable.outputs.ok == 'true'
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -n "$BYPASS" ]; then
            jq --arg b "$BYPASS" '.ci.collect.settings.extraHeaders = ({"x-vercel-protection-bypass": $b} | tostring)' \
              lighthouserc.json > lighthouserc.runtime.json
          else
            cp lighthouserc.json lighthouserc.runtime.json
          fi

      - name: Lighthouse (mobile, homepage + variant b)
        if: steps.reachable.outputs.ok == 'true'
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.preview.outputs.url }}/
            ${{ steps.preview.outputs.url }}/?variant=b
          configPath: ./lighthouserc.runtime.json
          uploadArtifacts: true
