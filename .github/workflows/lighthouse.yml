# Lighthouse CI on homepage-touching PRs (design-elevation milestone p3-lighthouse).
#
# Runs against the Vercel preview deployment for the PR branch. If the Vercel
# project has Deployment Protection enabled, add the project's automation
# bypass secret to the repo as VERCEL_AUTOMATION_BYPASS_SECRET (Vercel project
# → Settings → Deployment Protection → Protection Bypass for Automation);
# without it, protected previews serve Vercel's auth page and the run reports
# that instead of failing confusingly.
name: lighthouse

on:
  pull_request:
    paths:
      - 'app/**'
      - 'server/**'
      - 'vercel.json'
      - 'package.json'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read
  statuses: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel preview
        id: preview
        # Non-fatal on purpose: the action errors on a 401 wall, and the gate
        # below is where that becomes a verdict. Which verdict depends on
        # whether the bypass secret exists (see below).
        continue-on-error: true
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          vercel_protection_bypass_header: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # Reachability gate. This step used to turn EVERY unreachable preview into
      # a clean pass, so a green lighthouse check proved only that the job ran.
      # New rule: when VERCEL_AUTOMATION_BYPASS_SECRET is configured, the preview
      # is expected to be reachable and an unreachable one FAILS the job. The
      # clean skip survives only for the genuinely unconfigured case, where
      # there is nothing the run could have measured.
      #
      # Lighthouse stays NON-required for merge (repo branch protection): a perf
      # regression should file a ticket, not stall the release train on flaky
      # preview timing. Failing here makes the signal honest without making it
      # a gate.
      - name: Check preview is reachable
        id: reachable
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${BYPASS}" ]; then
            echo "::notice::VERCEL_AUTOMATION_BYPASS_SECRET is not set, so a protected preview cannot be fetched. Skipping Lighthouse. Add the secret (Vercel project -> Settings -> Deployment Protection -> Protection Bypass for Automation) to turn this into a real measurement."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${PREVIEW_URL}" ]; then
            echo "::error::No Vercel preview URL for this PR, but VERCEL_AUTOMATION_BYPASS_SECRET is configured. Either the preview build failed or the wait step timed out. Not reporting a pass for a page that was never measured."
            exit 1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "x-vercel-protection-bypass: ${BYPASS}" \
            -H "x-vercel-set-bypass-cookie: false" \
            "${PREVIEW_URL}/")
          if [ "$code" != "200" ]; then
            echo "::error::Preview ${PREVIEW_URL}/ returned HTTP ${code} with the bypass header applied. A wrong or expired bypass secret returns 401/403; a broken deployment returns 5xx. Failing rather than measuring an auth page or silently passing."
            exit 1
          fi

          echo "Preview reachable (HTTP 200)."
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Inject protection-bypass header into LHCI config
        if: steps.reachable.outputs.ok == 'true'
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -n "$BYPASS" ]; then
            jq --arg b "$BYPASS" '.ci.collect.settings.extraHeaders = ({"x-vercel-protection-bypass": $b} | tostring)' \
              lighthouserc.json > lighthouserc.runtime.json
          else
            cp lighthouserc.json lighthouserc.runtime.json
          fi

      - name: Lighthouse (mobile, homepage + variant b)
        if: steps.reachable.outputs.ok == 'true'
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.preview.outputs.url }}/
            ${{ steps.preview.outputs.url }}/?variant=b
          configPath: ./lighthouserc.runtime.json
          uploadArtifacts: true
