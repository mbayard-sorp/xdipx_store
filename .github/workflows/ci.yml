# Static checks on every pull request, and on main itself.
#
# Before this workflow the only PR check in the repo was `lighthouse`, which
# skips cleanly whenever the Vercel preview is missing or protected, so a green
# result proved nothing. Typecheck, tests, and build ran only inside agent
# sessions, on the honor system. This job is the status check the autonomous
# release engine gates merges on, so it must run on every path (docs PRs get a
# fast green rather than no signal at all).
#
# Why it also runs on push to main: a PR's check proves that PR is green
# against the main it was branched from, which is not the same claim as "main
# is green". Every agent PR is tested in isolation, then squash-merged, so N
# individually-green PRs can combine into a red main and nothing would report
# it. On 2026-08-16 eighteen PRs were drained in one sitting, several touching
# the same files, and the combined result had to be verified by hand in a
# scratch worktree because CI had no opinion about main at all. This job is
# that verification, automated. It gates nothing (the merge already happened);
# it is the alarm that main regressed, and the signal a revert decision needs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # PR runs supersede each other: only the newest commit on a branch matters,
  # and cancelling the rest saves Actions minutes.
  #
  # main runs must NOT cancel. GitHub reports a superseded run as `cancelled`,
  # which is indistinguishable from "no verdict" rather than from "green", and
  # unlike a PR there is nothing watching main to notice and re-trigger it. A
  # burst of merges would leave every commit but the last with no coverage,
  # silently, which is the exact hole this trigger exists to close. Serialising
  # them is the cost of every commit getting an answer.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Several server modules construct their Neon client at import time
      # (app/lib/db.server.ts, app/lib/gsc.server.ts), so importing them with
      # no connection string throws before a single test body runs. Locally
      # that is masked by .env. The suite is unit-level and never opens a
      # connection, so a syntactically valid placeholder is all it needs.
      # This is not a credential and must never be pointed at a real database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` runs postinstall, which builds only when VERCEL=1. It is unset
      # here, so install stays fast and the build below is the explicit step.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # `server/vercel-entry.mjs` is a build artifact that is committed on
      # purpose: vercel.json uses the legacy `builds` array, and Vercel matches
      # `builds[].src` against the files in the repo before any build runs, so
      # the file has to exist in git or the deployment gets no function at all.
      # Vercel does rebuild it during install (the `postinstall` script), so a
      # stale copy does not ship, but a committed copy that disagrees with
      # source makes every local read of the artifact a lie. This step keeps the
      # two honest. Only this file should be dirty after a build; `build/` is
      # gitignored.
      - name: Assert build artifacts are in sync
        run: |
          if ! git diff --quiet; then
            echo "::error::Build produced a dirty tree. Run 'npm run build' and commit the result."
            git status --short
            git diff --stat
            exit 1
          fi

  # Real-Postgres dry-run for migration PRs (ticket: migration 080 merged and
  # sat unapplied for ~20h, 500ing the social lane; scripts/apply-additive-
  # migrations.ts now auto-applies additive migrations at build time, but
  # nothing had proven the SQL in a new migration file actually executes
  # cleanly before it reached a PR review). This job spins up a throwaway
  # postgres:16 service and runs the same classifier + executor the
  # production build uses, in --dry-run mode (no production gate, no ledger
  # writes, see the script for both).
  #
  # Deliberately NOT part of the `check` job: `check` is the release engine's
  # REQUIRED_CHECK gate (app/lib/release-engine.server.ts), and every PR that
  # touches db/migrations/** is already a protected path
  # (PROTECTED_GLOBS in app/lib/github.server.ts) that stops for the owner
  # regardless of CI. Folding this in would only slow down every non-migration
  # PR for a check that can never change their merge eligibility. It still
  # needs to be a real, visible check on the PR though, which is what a
  # separate job gives us: it always runs and reports (skipping its real work
  # when the PR does not touch migrations), so a migration PR shows a genuine
  # pass/fail rather than nothing.
  migration-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Real connection to the service container above (not the check job's
      # placeholder): --dry-run actually executes every additive-classified
      # migration file against this database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      # Same source of truth as .github/workflows/agent-allowlist.yml: the
      # PR's changed-file list from the API, not a local branch diff (which
      # would need full history and a merge-base guess) and not PR text.
      - name: Determine whether this PR touches db/migrations/**
        id: touch
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' > files.txt
          if grep -q '^db/migrations/' files.txt; then
            echo "Migration files changed:"
            grep '^db/migrations/' files.txt | sed 's/^/  /'
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "No db/migrations/** changes on this PR. Skipping dry-run."
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.touch.outputs.touched == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.touch.outputs.touched == 'true'
        run: npm ci

      - name: Wait for Postgres
        if: steps.touch.outputs.touched == 'true'
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U ci && exit 0
            sleep 1
          done
          echo "::error::postgres service never became ready"
          exit 1

      - name: Migration dry-run against real Postgres
        if: steps.touch.outputs.touched == 'true'
        run: npx tsx scripts/apply-additive-migrations.ts --dry-run
