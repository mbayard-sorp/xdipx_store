name: Cron manual dispatch

# Manual trigger for the xdipx /cron/* endpoints.
#
# History: Vercel's native cron scheduler appeared dead in June 2026, so this
# workflow carried the schedules for a while. Verified July 2026: Vercel cron
# IS invoking every configured job on the exact schedule (GET requests,
# cache=BYPASS, in the runtime logs), which made the schedules here a source
# of double-firing — the nightly job ran at 23:59 via Vercel and again up to
# two hours later via a delayed GitHub run. The schedule triggers were
# therefore removed; vercel.json's `crons` block is authoritative again.
#
# This workflow remains as a manual escape hatch (workflow_dispatch) for
# kicking an endpoint on demand — e.g. re-running a missed job or testing.
# `vercel crons run /cron/<name>` from the Vercel CLI does the same thing.
#
# Each endpoint validates `Authorization: Bearer $CRON_SECRET` (see the
# guard in server/cron.ts). CRON_SECRET is a repo Actions secret:
#   gh secret set CRON_SECRET --body "<the production CRON_SECRET>"

on:
  workflow_dispatch:
    inputs:
      target:
        description: Endpoint to trigger manually
        required: true
        default: import-monitor
        type: choice
        options:
          - all
          - discontinued-sweep
          - profit-summary
          - review-reminders
          - keyword-research
          - log-monitor
          - pricing-batch-recompute
          - import-monitor
          - import-enrich
          - enrichment-batch-poller
          - homepage-healthcheck
          - notebook-healthcheck
          - aeo-surface-check
          - gsc-snapshot
          - warm
          - warm-discovery-index

concurrency:
  group: cron-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://xdipx.com
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Resolve endpoints for this trigger
        id: resolve
        run: |
          t='${{ github.event.inputs.target }}'
          if [ "$t" = "all" ]; then
            # keyword-research is absent from 'all' on purpose: it runs on
            # its own monthly schedule, is valve-gated server-side
            # (keyword_research_enabled), and stays individually
            # dispatchable via the target dropdown.
            paths='discontinued-sweep profit-summary review-reminders log-monitor pricing-batch-recompute import-monitor import-enrich enrichment-batch-poller homepage-healthcheck notebook-healthcheck aeo-surface-check warm warm-discovery-index'
          else
            paths="$t"
          fi
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "Triggering: $paths"

      - name: POST /cron endpoints
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          fail=0
          for p in ${{ steps.resolve.outputs.paths }}; do
            url="$BASE_URL/cron/$p"
            echo "→ POST $url"
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' \
              --max-time 300 --retry 2 --retry-delay 5 \
              -X POST "$url" \
              -H "Authorization: Bearer $CRON_SECRET")
            echo "  HTTP $code"
            echo "  $(head -c 600 "$body")"
            case "$code" in
              2*) ;;
              *) echo "::error::$p returned HTTP $code"; fail=1 ;;
            esac
          done
          exit $fail
