name: Diag homepage fetch (temporary)

# Temporary diagnostic for the homepage-healthcheck "no valid JSON-LD" failures.
# Fetches / and /discover with different user agents and reports JSON-LD counts,
# body size, and cache headers. Delete once the healthcheck issue is resolved.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch pages with each UA
        run: |
          for path in / /discover; do
            for ua in "xdipx-homepage-healthcheck" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"; do
              echo "=============================================="
              echo "PATH: $path  UA: $ua"
              hdrs=$(mktemp); body=$(mktemp)
              code=$(curl -sS -o "$body" -D "$hdrs" -w '%{http_code} time_total=%{time_total}' \
                --max-time 60 "https://xdipx.com$path" -H "User-Agent: $ua")
              echo "HTTP $code"
              grep -i -E 'x-vercel-cache|x-vercel-id|age:|cache-control|content-length' "$hdrs" || true
              echo "body bytes: $(wc -c < "$body")"
              echo "ld+json scripts: $(grep -o 'application/ld+json' "$body" | wc -l)"
              echo "img tags: $(grep -o '<img' "$body" | wc -l)"
              echo "has </html>: $(grep -c '</html>' "$body" || true)"
              echo "--- body tail (last 400 chars) ---"
              tail -c 400 "$body"; echo
            done
          done
