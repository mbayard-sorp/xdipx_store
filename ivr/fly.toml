# Fly.io config for the xdipx IVR WebSocket bridge.
# Deploy from the ivr/ directory: `fly deploy`.
# App name is created on first `fly launch`; edit after that here.

app = "xdipx-ivr"
primary_region = "ord"  # Chicago — adjust to nearest Twilio voice region if needed
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # keep warm — cold start during a live call is unacceptable
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
